# Push to main: GitHub Release (notes = commits since the previous tag)
# and the production image on GHCR (:<tag> and :latest).
#
# The image job stays in this workflow because a release created with
# GITHUB_TOKEN does not start a separate workflow.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            prev=""
          fi

          if [ -n "$prev" ]; then
            git log --pretty=format:'- %s (%h)' "${prev}..HEAD" > "$RUNNER_TEMP/notes.md"
          else
            git log --pretty=format:'- %s (%h)' > "$RUNNER_TEMP/notes.md"
          fi
          echo >> "$RUNNER_TEMP/notes.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target "$GITHUB_SHA"
          fi

  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
