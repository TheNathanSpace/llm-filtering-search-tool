services:
  llm-filtering:
    build:
      context: .
    pull_policy: build
    image: llm-filtering:latest
    container_name: llm-filtering
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Image must listen on all interfaces; host .env often uses 127.0.0.1 for local dev.
      BACKEND_HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    ports:
      - "${FRONTEND_PORT:-3030}:${FRONTEND_PORT:-3030}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:$${BACKEND_PORT:-8000}/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
