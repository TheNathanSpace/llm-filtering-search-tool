# Server deploy. Copy this file, edit the values, then: docker compose up -d
#
# Image: ghcr.io/thenathanspace/llm-filtering-search-tool
# The package must be public, or log in first: docker login ghcr.io
# Pin a release tag instead of latest for a fixed build.
#
# UI: http://localhost:3030  (change the host port below to publish elsewhere)
# SQLite, logs, and caches persist in ./data next to this file.
#
# Prefer a separate env file? Copy .env.template from the repo to .env and
# replace the environment: block with env_file: [.env]. Inline values below
# are the go-to setup.

services:
  llm-filtering:
    image: ghcr.io/thenathanspace/llm-filtering-search-tool:latest
    pull_policy: always
    container_name: llm-filtering
    restart: unless-stopped
    ports:
      # host:container — the container side must match FRONTEND_PORT
      - "3030:3030"
    environment:
      # Required. https://openrouter.ai/
      OR_API_KEY: "replace-with-your-openrouter-api-key"
      # Optional. Set to 1 to gap-fill missing open-weights / size
      # via OpenRouter Batch (paid). Refresh swaps first. One batch runs in the
      # background, then the next waits 24h after that run finishes.
      # OR_WEB_ENRICHMENT: "1"
      # Optional Hugging Face token (higher rate limits for size enrichment).
      # HF_TOKEN: "replace-with-your-huggingface-token"
      DATA_DIR: "/app/data"
      LOG_LEVEL: "INFO"
      LOG_FILE_COUNT: "10"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3030"
      # IANA timezone for log timestamps. Example: America/Denver.
      TZ: "Etc/UTC"
      # Set to 1 to serve FastAPI /docs, /redoc, and /openapi.json.
      # ENABLE_API_DOCS: "1"
      # Optional. Public origin of another running instance. On each start, this
      # process replaces its database and caches from that instance's
      # /api/export snapshot. The page shows a warning until this is removed
      # and the container is restarted (otherwise every start downloads it again).
      # EXPORT_BASE_URL: "http://other-host:3030"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:$${BACKEND_PORT:-8000}/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
